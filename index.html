<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="澄浅起始页是一款极简、开源、美观的起始页。PaleasyStart is a minimal, open-source, beautiful start page." />
    <meta name="keywords" content="澄浅,起始页,澄浅起始页,Paleasy,Start,PaleasyStart,极简的起始页,开源的起始页,美观的起始页,minimal,open-source,startpage,page" />
    <title>PaleasyStart</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
            --hover-bg: rgba(255, 255, 255, 0.18);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --liquid-glass-blur: blur(10px) saturate(110%);
            --radius: 20px;
            --radius-sm: 12px;
            --menu-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            --default-dark-gradient: linear-gradient(to bottom, #2d2d2d 0%, #1f1f1f 50%, #2d2d2d 100%);
            --default-light-gradient: linear-gradient(to bottom, #f0f0f0 0%, #dcdcdc 50%, #f0f0f0 100%);
            --before-opacity: 1;
            --default-gradient: var(--default-dark-gradient);
            --liquid-glass-bg: rgba(255, 255, 255, 0.15);
            --liquid-glass-border: rgba(255, 255, 255, 0.20);
            --liquid-glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        body.theme-dark {
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.78);
            --menu-bg: rgba(22, 22, 40, 0.82);
            --menu-border: rgba(255, 255, 255, 0.2);
            --default-gradient: var(--default-dark-gradient);
            --menu-fallback-bg: var(--default-dark-gradient);
            --selected-text-color: #000000;
            --selected-bg: rgba(255, 255, 255, 0.85);
            --glass-bg: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
            --hover-bg: rgba(255, 255, 255, 0.18);
            --fallback-char-color: #ffffff;
            --liquid-glass-bg: rgba(0, 0, 0, 0.15);
            --liquid-glass-border: rgba(0, 0, 0, 0.20);
            --liquid-glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            --modal-bg: var(--default-dark-gradient);
            --modal-border: rgba(255, 255, 255, 0.3);
            --modal-btn-bg: rgba(255, 255, 255, 0.12);
            --modal-btn-hover-bg: rgba(255, 255, 255, 0.22);
            --delete-zone-bg: rgba(255, 0, 0, 0.3);
            --delete-zone-border: rgba(255, 0, 0, 0.5);
        }

        body.theme-light {
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --menu-bg: rgba(255, 255, 255, 0.85);
            --menu-border: rgba(0, 0, 0, 0.15);
            --default-gradient: var(--default-light-gradient);
            --menu-fallback-bg: var(--default-light-gradient);
            --selected-text-color: #ffffff;
            --selected-bg: rgba(0, 0, 0, 0.8);
            --glass-bg: rgba(0, 0, 0, 0.06);
            --glass-border: rgba(0, 0, 0, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            --hover-bg: rgba(0, 0, 0, 0.08);
            --fallback-char-color: #000000;
            --liquid-glass-bg: rgba(255, 255, 255, 0.15);
            --liquid-glass-border: rgba(255, 255, 255, 0.20);
            --liquid-glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --modal-bg: var(--default-light-gradient);
            --modal-border: rgba(0, 0, 0, 0.2);
            --modal-btn-bg: rgba(0, 0, 0, 0.06);
            --modal-btn-hover-bg: rgba(0, 0, 0, 0.12);
            --delete-zone-bg: rgba(255, 0, 0, 0.3);
            --delete-zone-border: rgba(255, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            user-select: none;
            transition: background-image 0.8s ease, color 0.3s ease;
            touch-action: none;
            overscroll-behavior: none;
            isolation: isolate;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--default-gradient);
            background-size: 100% 200%;
            animation: gradientShift 20s ease infinite;
            opacity: var(--before-opacity, 1);
            transition: opacity 0.6s ease;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        body.has-custom-bg::after {
            opacity: 1;
        }
        body.has-custom-bg::before {
            opacity: 0.3;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 0%;
            }
            25% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 0% 100%;
            }
            75% {
                background-position: 0% 50%;
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        .visually-hidden {
            position: absolute !important;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
            opacity: 0;
        }

        .main-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.2rem;
            width: 100%;
            max-width: 748px;
            padding: 2rem;
            z-index: 1;
            animation: fadeInUp 1s ease both;
            margin-top: -10vh;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .main-center.animation-done {
            animation: none !important;
            transform: none !important;
        }

        .clock-section {
            text-align: center;
            color: var(--text-primary);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .clock-section.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            height: 0;
            margin: 0;
            overflow: hidden;
        }
        .time {
            font-size: 4.2rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            line-height: 1;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            transition: text-shadow 0.3s ease;
        }
        .time:hover {
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.45);
        }
        .date {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            letter-spacing: 0.12em;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.2);
            transition: none;
        }

        .search-wrapper {
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .search-box-container {
            position: relative;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            z-index: 20;
            transition: opacity 0.3s ease, transform 0.3s ease, max-height 0.3s ease;
        }
        /* 隐藏搜索框时 */
        .search-box-container.hidden {
            opacity: 0;
            transform: scale(0.95);
            max-height: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            will-change: backdrop-filter;
            border: none;
            border-radius: var(--radius);
            box-shadow: var(--liquid-glass-shadow);
            transition: var(--transition);
            position: relative;
            overflow: visible;
            z-index: 1;
            padding: 0.5rem 0.7rem;
            transform: translateZ(0);
            backface-visibility: hidden;
            contain: layout style paint;
        }
        .search-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.12) 0%, transparent 40%, transparent 60%, rgba(255, 255, 255, 0.08) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }
        .search-box:hover::before {
            opacity: 1;
        }
        .search-box:focus-within {
            box-shadow: var(--liquid-glass-shadow);
        }

        .engine-toggle {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.4rem 0.7rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
            position: relative;
        }
        .engine-toggle:hover {
            background: var(--hover-bg);
            transform: scale(1.03);
        }
        .engine-toggle:active {
            transform: scale(0.96);
        }

        .engine-logo-badge {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
            background: transparent;
            overflow: hidden;
        }
        .engine-logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            pointer-events: none;
        }
        .engine-logo-badge .fallback-text {
            display: none;
            font-size: 1rem;
            font-weight: 700;
            color: var(--fallback-char-color);
        }

        .engine-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.03em;
            white-space: nowrap;
            transition: var(--transition);
        }
        .engine-caret {
            width: 15px;
            height: 15px;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }
        .engine-toggle.menu-open .engine-caret {
            transform: rotate(180deg);
        }

        .engine-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            min-width: 220px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            border: none;
            border-radius: var(--radius);
            box-shadow: var(--liquid-glass-shadow);
            transition: background 0.6s ease, opacity 0.25s ease, visibility 0.25s ease;
            z-index: 99999;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
            will-change: opacity, visibility, backdrop-filter, transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            contain: layout style paint;
        }
        .engine-menu.show {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .settings-panel,
        .language-menu {
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            border: none;
            border-radius: var(--radius);
            box-shadow: var(--liquid-glass-shadow);
            transition: background 0.6s ease, opacity 0.25s ease, transform 0.25s ease;
            z-index: 9999;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
            will-change: transform, opacity, backdrop-filter;
            transform: translateZ(0);
            backface-visibility: hidden;
            contain: layout style paint;
        }

        .settings-panel {
            position: fixed;
            top: 5.2rem;
            right: 1.5rem;
            min-width: 240px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px) scale(0.98);
        }
        .settings-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .language-menu {
            position: fixed;
            top: 5.2rem;
            right: 1.5rem;
            min-width: 160px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px) scale(0.98);
        }
        .language-menu.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .engine-menu-item,
        .language-menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.9rem;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.92rem;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            position: relative;
        }
        .engine-menu-item:hover,
        .language-menu-item:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            transform: translateX(4px);
        }
        .engine-menu-item.active,
        .language-menu-item.active {
            background: var(--selected-bg);
            color: var(--selected-text-color);
            font-weight: 500;
        }
        .engine-menu-item .mini-logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent;
            overflow: hidden;
        }
        .engine-menu-item .mini-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
            display: block;
            pointer-events: none;
        }
        .engine-menu-item .mini-logo .fallback-text {
            display: none;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--fallback-char-color);
        }
        .engine-menu-item .check-mark {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            opacity: 0;
            transition: var(--transition);
            flex-shrink: 0;
            margin-left: auto;
        }
        .engine-menu-item.active .check-mark {
            opacity: 1;
            background: currentColor;
            border-color: currentColor;
        }
        .search-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            padding: 0.75rem 0.4rem;
            letter-spacing: 0.02em;
            font-weight: 400;
            min-width: 0;
        }
        .search-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
            font-weight: 300;
            letter-spacing: 0.04em;
            transition: var(--transition);
        }
        .search-input:focus::placeholder {
            opacity: 0.4;
            transform: translateX(5px);
        }

        .search-submit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            margin-left: 0.25rem;
            -webkit-tap-highlight-color: transparent;
        }
        .search-submit-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            transform: scale(1.05);
        }
        .search-submit-btn:active {
            transform: scale(0.95);
        }
        .search-submit-btn svg {
            width: 20px;
            height: 20px;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            justify-content: center;
            margin-top: 0.8rem;
            min-height: 0;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .quick-links:empty {
            display: none;
        }

        /* 优化：固定快捷图标卡片宽度，避免因名称过长而拉伸 */
        .quick-link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            border: none;
            border-radius: 14px;
            padding: 0.7rem 0.4rem;
            width: 72px;          /* 固定宽度 */
            flex: 0 0 auto;       /* 不伸缩 */
            transition: var(--transition), transform 0.25s cubic-bezier(0.2, 0, 0, 1);
            box-shadow: var(--liquid-glass-shadow);
            position: relative;
            text-decoration: none;
            color: var(--text-primary);
            z-index: 1;
            -webkit-user-drag: element;
            user-select: none;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
            contain: layout style paint;
        }
        .quick-link-item:hover {
            background: var(--hover-bg);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        .quick-link-item:active {
            transform: translateY(0) scale(0.95);
        }
        .quick-link-item.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }
        .quick-link-item.drag-over {
            outline: 2px solid var(--selected-bg);
            outline-offset: -2px;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .quick-link-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            background: transparent;
            flex-shrink: 0;
            position: relative;
            pointer-events: none;
        }
        .quick-link-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: block;
        }
        .quick-link-icon .fallback-char {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--fallback-char-color);
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            display: none;
        }
        .quick-link-icon.fallback .fallback-char {
            display: block;
        }
        .quick-link-icon.fallback {
            background: #555;
        }
        .quick-link-name {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            max-width: 64px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            pointer-events: none;
            line-height: 1.2;
        }

        .top-right-controls {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 200;
        }
        .language-btn,
        .settings-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            border: none;
            box-shadow: var(--liquid-glass-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, backdrop-filter;
            contain: layout style paint;
        }
        .language-btn:hover,
        .settings-btn:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            transform: scale(1.05);
        }
        .language-btn:active,
        .settings-btn:active {
            transform: scale(0.95);
        }
        .language-btn {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .settings-btn svg {
            width: 22px;
            height: 22px;
        }

        .settings-panel-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            letter-spacing: 0.02em;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .settings-panel-item:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
            transform: translateX(4px);
        }
        .settings-panel-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        .settings-submenu {
            padding-left: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .settings-submenu.open {
            max-height: 400px;
            opacity: 1;
        }
        .settings-submenu-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.8rem;
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.82rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .settings-submenu-item:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }
        .settings-submenu-item svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }
        .settings-divider {
            height: 1px;
            background: var(--menu-border);
            margin: 0.3rem 0;
            flex-shrink: 0;
        }

        .quick-link-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.5rem 0.3rem;
        }
        .quick-link-form input {
            background: var(--liquid-glass-bg);
            border: none;
            border-radius: 6px;
            padding: 0.5rem 0.7rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            letter-spacing: 0.02em;
        }
        .quick-link-form input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }
        .quick-link-form input:focus {
            background: var(--hover-bg);
        }
        .quick-link-form button {
            background: var(--liquid-glass-bg);
            border: none;
            border-radius: 6px;
            padding: 0.5rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .quick-link-form button:hover {
            background: var(--hover-bg);
            transform: translateY(-1px);
        }

        #iconListContainer {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            max-height: 200px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.75rem 1.5rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            box-shadow: var(--liquid-glass-shadow);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            opacity: 0;
            z-index: 500;
            pointer-events: none;
            white-space: nowrap;
            transform: translateX(-50%) translateY(100px);
            will-change: transform, opacity, backdrop-filter;
            contain: layout style paint;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .about-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .about-modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .about-modal {
            background: var(--modal-bg);
            border: none;
            border-radius: var(--radius);
            box-shadow: var(--liquid-glass-shadow);
            padding: 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            max-width: 400px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            will-change: transform, backdrop-filter;
            contain: layout style paint;
        }
        .about-modal-overlay.show .about-modal {
            transform: translateY(0);
        }
        .about-modal img.favicon {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: contain;
        }
        .about-modal-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .about-modal-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }
        .about-modal-link,
        .about-modal-close-btn {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            background: var(--modal-btn-bg);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
        }
        .about-modal-link:hover,
        .about-modal-close-btn:hover {
            background: var(--modal-btn-hover-bg);
            transform: translateY(-2px);
        }

        #deleteZone {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 60px;
            background: var(--delete-zone-bg);
            border: 2px dashed var(--delete-zone-border);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1rem;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            will-change: opacity, backdrop-filter;
            contain: layout style paint;
        }
        #deleteZone.show {
            opacity: 1;
            pointer-events: auto;
        }
        #deleteZone.drag-over {
            background: rgba(255, 0, 0, 0.6);
        }

        .drop-placeholder {
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            flex-shrink: 0;
            width: 72px; /* 与卡片同宽 */
            height: 90px; /* 与卡片大致同高 */
        }

        /* ===== 自定义滚动条（液态玻璃风格） ===== */
        .settings-panel::-webkit-scrollbar,
        .settings-submenu::-webkit-scrollbar,
        #iconListContainer::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .settings-panel::-webkit-scrollbar-track,
        .settings-submenu::-webkit-scrollbar-track,
        #iconListContainer::-webkit-scrollbar-track {
            background: var(--liquid-glass-bg);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            border-radius: 10px;
            margin: 4px 0;
        }

        .settings-panel::-webkit-scrollbar-thumb,
        .settings-submenu::-webkit-scrollbar-thumb,
        #iconListContainer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: var(--liquid-glass-blur);
            -webkit-backdrop-filter: var(--liquid-glass-blur);
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            transition: background 0.2s;
        }

        .settings-panel::-webkit-scrollbar-thumb:hover,
        .settings-submenu::-webkit-scrollbar-thumb:hover,
        #iconListContainer::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* 兼容 Firefox */
        .settings-panel,
        .settings-submenu,
        #iconListContainer {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) var(--liquid-glass-bg);
        }

        @media (max-width: 600px) {
            :root {
                --liquid-glass-blur: blur(8px) saturate(110%);
                --liquid-glass-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            }
            .main-center {
                padding: 1.2rem;
                gap: 1.5rem;
                margin-top: -5vh;
            }
            .time {
                font-size: 2.8rem;
            }
            .date {

            }
            .search-input {

            }
            .engine-toggle {
                padding: 0.3rem 0.5rem;
                gap: 0.4rem;
            }
            .engine-logo-badge {
                width: 26px;
                height: 26px;
            }
            .engine-logo-badge img {
                border-radius: 6px;
            }
            .engine-label {
                font-size: 0.8rem;
            }
            .engine-caret {
                width: 11px;
                height: 11px;
            }
            .top-right-controls {
                top: 1rem;
                right: 1rem;
                gap: 0.5rem;
            }
            .settings-btn,
            .language-btn {
                width: 40px;
                height: 40px;
            }
            .settings-btn svg {
                width: 18px;
                height: 18px;
            }
            .language-btn {
                font-size: 0.95rem;
            }
            .search-submit-btn {
                width: 36px;
                height: 36px;
            }
            .search-submit-btn svg {
                width: 18px;
                height: 18px;
            }
            .settings-panel {
                top: 4.5rem;
                right: 1rem;
                min-width: 200px;
                max-height: calc(100vh - 100px);
            }
            .language-menu {
                top: 4.5rem;
                right: 1rem;
                min-width: 160px;
            }
            .quick-link-item {
                width: 64px;
                padding: 0.5rem 0.2rem;
            }
            .quick-link-icon {
                width: 32px;
                height: 32px;
                font-size: 1.1rem;
            }
            .quick-link-name {
                font-size: 0.6rem;
                max-width: 56px;
            }
            .drop-placeholder {
                width: 64px;
                height: 80px;
            }
            .toast {
                font-size: 0.8rem;
                padding: 0.6rem 1.1rem;
                bottom: 1.2rem;
            }
            .engine-menu {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0.98);
                min-width: 220px;
                max-width: 90vw;
                max-height: 70vh;
                overflow-y: auto;
                z-index: 99999;
                border-radius: 16px;
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
                -webkit-overflow-scrolling: touch;
                overscroll-behavior: contain;
                touch-action: pan-y;
                margin-top: 0;
                top: 50%;
                left: 50%;
                bottom: auto;
            }
            .engine-menu.show {
                transform: translate(-50%, -50%) scale(1);
            }
            .engine-menu-item {
                padding: 0.8rem 1rem;
                font-size: 0.95rem;
            }
            .engine-menu-item .mini-logo {
                width: 26px;
                height: 26px;
            }
            .about-modal {
                padding: 1.5rem 1.8rem;
                gap: 1rem;
            }
            .about-modal img.favicon {
                width: 48px;
                height: 48px;
            }
        }

        @media (max-width: 380px) {
            :root {
                --liquid-glass-blur: blur(6px) saturate(110%);
            }
            .time {
                font-size: 2.2rem;
            }
            .engine-label {
                font-size: 0.7rem;
            }
            .engine-logo-badge {
                width: 22px;
                height: 22px;
            }
            .search-box {
                border-radius: 14px;
                padding: 0.2rem 0.4rem;
            }
            .search-submit-btn {
                width: 32px;
                height: 32px;
            }
            .search-submit-btn svg {
                width: 16px;
                height: 16px;
            }
            .engine-menu-item .mini-logo {
                width: 22px;
                height: 22px;
            }
            .settings-panel {
                max-height: calc(100vh - 80px);
            }
            .quick-link-item {
                width: 58px;
                padding: 0.4rem 0.1rem;
            }
            .quick-link-name {
                font-size: 0.55rem;
                max-width: 50px;
            }
            .drop-placeholder {
                width: 58px;
                height: 72px;
            }
        }
    </style>

            function detectSystemLanguage() {
                const lang = navigator.language || navigator.userLanguage || 'en';
                if (lang.toLowerCase().startsWith('zh')) {
                    if (lang.toLowerCase().includes('tw') || lang.toLowerCase().includes('hk') || lang.toLowerCase().includes('mo')) {
                        return 'zh-TW';
                    }
                    return 'zh';
                }
                return 'en';
            }

            function getInitialBaseLanguage() {
                const stored = localStorage.getItem(STORAGE_KEYS.language);
                if (stored === 'zh' || stored === 'en') {
                    return stored;
                }
                const sys = detectSystemLanguage();
                return (sys === 'zh' || sys === 'zh-TW') ? 'zh' : 'en';
            }

            let baseLanguage = getInitialBaseLanguage();
            let currentLanguage = baseLanguage === 'zh' ? detectSystemLanguage() : 'en';

            function t(key) {
                return translations[currentLanguage][key] || translations.zh[key] || translations.en[key] || key;
            }

            function applyLanguage(baseLang) {
                baseLanguage = baseLang;
                localStorage.setItem(STORAGE_KEYS.language, baseLang);
                if (baseLang === 'zh') {
                    currentLanguage = detectSystemLanguage() === 'zh-TW' ? 'zh-TW' : 'zh';
                } else {

            // ==================== IndexedDB 封装 ====================
            let dbPromise;

            function openDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open(DB_NAME, DB_VERSION);
                        request.onerror = () => reject(request.error);
                        request.onsuccess = () => resolve(request.result);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(STORE_NAME)) {
                                db.createObjectStore(STORE_NAME);
                            }
                        };
                    });
                }
                return dbPromise;
            }

            async function saveImageToIndexedDB(key, dataUrl) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.put(dataUrl, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            async function loadImageFromIndexedDB(key) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async function deleteImageFromIndexedDB(key) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

                    return true;
                } catch (e) {

            function getEngine() {
                const engine = localStorage.getItem(STORAGE_KEYS.engine);
                return engines[engine] ? engine : 'google';
            }

            function setEngine(engine) {
                if (!engines[engine]) engine = 'google';
                localStorage.setItem(STORAGE_KEYS.engine, engine);
                updateEngineDisplay();
            }

            function updateEngineDisplay() {
                const current = getEngine();
                const config = engines[current];

                if (engineLogoImg) {
                    engineLogoImg.style.display = 'block';
                    engineLogoFallback.style.display = 'none';
                    engineLogoImg.onerror = () => {
                        engineLogoImg.style.display = 'none';
                        engineLogoFallback.textContent = config.name.charAt(0).toUpperCase();
                        engineLogoFallback.style.display = 'block';
                    };
                    engineLogoImg.onload = () => {
                        engineLogoImg.style.display = 'block';
                        engineLogoFallback.style.display = 'none';
                    };
                    engineLogoImg.src = config.icon;
                    engineLogoImg.alt = config.name;
                }
                engineLabel.textContent = config.name;

                engineMenuItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.engine === current);
                    const miniImg = item.querySelector('.mini-logo img');
                    const miniFallback = item.querySelector('.mini-logo .fallback-text');
                    if (miniImg && miniFallback) {
                        miniImg.style.display = 'block';
                        miniFallback.style.display = 'none';
                        miniImg.onerror = () => {
                            miniImg.style.display = 'none';
                            miniFallback.style.display = 'block';
                        };
                        miniImg.onload = () => {
                            miniImg.style.display = 'block';
                            miniFallback.style.display = 'none';
                        };
                        const engineKey = item.dataset.engine;
                        if (engines[engineKey]) {
                            miniImg.src = engines[engineKey].icon;
                        }
                    }
                });
            }

            // 新增：切换搜索引擎的函数（供 Tab 使用）
            function switchEngine(delta) {
                const engineKeys = Object.keys(engines);
                const current = getEngine();
                const idx = engineKeys.indexOf(current);
                const newIdx = (idx + delta + engineKeys.length) % engineKeys.length;
                const newEngine = engineKeys[newIdx];
                setEngine(newEngine);
                showToast(t('toast_switched_engine').replace('{engine}', engines[newEngine].name));
            }

            function performSearch(mode = 'redirect') {
                const query = searchInput.value.trim();
                if (!query) {
                    searchInput.focus();
                    searchInput.style.animation = 'shake 0.4s ease';
                    setTimeout(() => searchInput.style.animation = '', 400);
                    return;
                }
                const engine = getEngine();
                const cfg = engines[engine];
                const url = cfg.url + encodeURIComponent(query);
                if (mode === 'newtab') {
                    window.open(url, '_blank', 'noopener');
                } else {
                    window.location.href = url;
                }
            }

            // ==================== 时钟 ====================
            function padZero(num) { return num < 10 ? '0' + num : num; }

            function updateClock() {
                try {
                    const now = new Date();
                    timeDisplay.textContent = padZero(now.getHours()) + ':' + padZero(now.getMinutes()) + ':' + padZero(now
                    .getSeconds());
                    const isZh = currentLanguage === 'zh' || currentLanguage === 'zh-TW';
                    const weekdays = isZh ? ['日', '一', '二', '三', '四', '五', '六'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu',
                        'Fri', 'Sat'
                    ];
                    let dateStr;
                    if (isZh) {
                        dateStr =
                            `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekdays[now.getDay()]}`;
                    } else {
                        dateStr =
                            `${now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })} ${weekdays[now.getDay()]}`;
                    }
                    dateDisplay.textContent = dateStr;
                } catch (e) {
                    console.error('updateClock error:', e);
                }
            }

            function getClockVisible() {
                const stored = localStorage.getItem(STORAGE_KEYS.clockVisible);
                return stored === null ? true : stored === 'true';
            }

            function setClockVisible(visible) {
                localStorage.setItem(STORAGE_KEYS.clockVisible, visible ? 'true' : 'false');
                if (visible) {
                    clockSection.classList.remove('hidden');
                } else {
                    clockSection.classList.add('hidden');
                }
                updateClockToggleText();
            }

            // ==================== 搜索框显示隐藏 ====================
            function getSearchVisible() {
                const stored = localStorage.getItem(STORAGE_KEYS.searchVisible);
                return stored === null ? true : stored === 'true';
            }

            function setSearchVisible(visible) {
                localStorage.setItem(STORAGE_KEYS.searchVisible, visible ? 'true' : 'false');
                if (visible) {
                    searchBoxContainer.classList.remove('hidden');
                } else {
                    searchBoxContainer.classList.add('hidden');
                }
                updateSearchToggleText();

            // ==================== 主题管理 ====================
            function getCurrentTheme() { return localStorage.getItem(STORAGE_KEYS.theme) || 'dark'; }

            function applyTheme(theme) {
                try {
                    localStorage.setItem(STORAGE_KEYS.theme, theme);
                    body.classList.remove('theme-dark', 'theme-light');
                    body.classList.add(`theme-${theme}`);
                    updateThemeToggleText();
                    const savedGradient = localStorage.getItem(STORAGE_KEYS.bgGradient);
                    if (!savedGradient || savedGradient === DARK_GRADIENT || savedGradient === LIGHT_GRADIENT) {
                        localStorage.setItem(STORAGE_KEYS.bgGradient, theme === 'dark' ? DARK_GRADIENT : LIGHT_GRADIENT);
                    }
                    applyBackground();
                    showToast(theme === 'dark' ? t('toast_switched_theme_dark') : t('toast_switched_theme_light'));
                } catch (e) {
                    console.error('applyTheme error:', e);
                }
            }

            // ==================== 背景管理 ====================
            function createDynBgStyle() {
                let el = document.getElementById('dynBgStyle');
                if (!el) {
                    el = document.createElement('style');
                    el.id = 'dynBgStyle';
                    document.head.appendChild(el);
                }
                return el;
            }

            function setBeforeOpacity(opacity) {
                body.style.setProperty('--before-opacity', opacity);
            }

            function applyGradientBackground(gradient, theme) {
                const defaultGrad = theme === 'dark' ? DARK_GRADIENT : LIGHT_GRADIENT;
                const finalGradient = gradient || defaultGrad;
                const styleEl = createDynBgStyle();
                styleEl.textContent =
                    `body::before{background:${finalGradient};background-size:100% 200%;animation:gradientShift 20s ease infinite;}`;
            }

            async function applyBackground() {
                const marker = localStorage.getItem(STORAGE_KEYS.bgImageMarker);
                const savedGradient = localStorage.getItem(STORAGE_KEYS.bgGradient);
                const theme = getCurrentTheme();

                if (marker !== 'true') {
                    body.classList.remove('has-custom-bg');
                    applyGradientBackground(savedGradient, theme);
                    setBeforeOpacity(1);
                    return;
                }

                try {
                    const dataUrl = await loadImageFromIndexedDB(BG_IMAGE_KEY);
                    if (dataUrl) {
                        body.classList.add('has-custom-bg');
                        const styleEl = createDynBgStyle();
                        styleEl.textContent =
                            `body.has-custom-bg::after{background-image:url(${dataUrl});opacity:1;}body.has-custom-bg::before{opacity:0.3;}`;
                    } else {
                        localStorage.removeItem(STORAGE_KEYS.bgImageMarker);
                        body.classList.remove('has-custom-bg');
                        applyGradientBackground(savedGradient, theme);
                    }
                } catch (e) {
                    console.error('Failed to load image from IndexedDB', e);

            function loadFaviconWithTimeout(url, timeoutMs) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    let settled = false;
                    const timeoutId = setTimeout(() => {
                        if (!settled) { settled = true; reject(new Error('timeout')); }
                    }, timeoutMs);
                    img.onload = () => {
                        if (!settled) { settled = true; clearTimeout(timeoutId); resolve(url); }
                    };
                    img.onerror = () => {
                        if (!settled) { settled = true; clearTimeout(timeoutId); reject(new Error('error')); }
                    };
                    img.src = url;
                });
            }

            // 获取 favicon：优先从 IndexedDB 读取，若无则从网络获取并缓存
            async function fetchFaviconWithCache(domain) {
                // 1. 先检查内存缓存
                if (faviconCache.has(domain)) {
                    const cached = faviconCache.get(domain);
                    if (cached) return cached;
                }

                // 2. 从 IndexedDB 读取
                const cachedData = await getFaviconFromCache(domain);
                if (cachedData) {
                    faviconCache.set(domain, cachedData);
                    return cachedData;
                }

                // 3. 从网络获取
                const candidates = [
                    `https://${domain}/favicon.ico`,
                    `https://${domain}/favicon.png`,
                    `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`
                ];

                for (const url of candidates) {
                    try {
                        await loadFaviconWithTimeout(url, FAVICON_TIMEOUT);
                        // 获取成功，将图片转为 dataUrl 存入 IndexedDB
                        try {
                            const img = new Image();
                            img.crossOrigin = 'anonymous';
                            await new Promise((resolve, reject) => {
                                img.onload = resolve;
                                img.onerror = reject;
                                img.src = url;
                            });
                            const canvas = document.createElement('canvas');
                            canvas.width = img.naturalWidth || 64;
                            canvas.height = img.naturalHeight || 64;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const dataUrl = canvas.toDataURL('image/png');
                            await saveFaviconToCache(domain, dataUrl);
                            faviconCache.set(domain, dataUrl);
                            return dataUrl;
                        } catch (convErr) {
                            // 转换失败，直接存储 URL 作为后备
                            faviconCache.set(domain, url);
                            return url;
                        }
                    } catch (e) {
                        continue;
                    }
                }
                return null;
            }

            function renderQuickLinks() {

                links.forEach((link, index) => {
                    const item = document.createElement('a');
                    item.className = 'quick-link-item';
                    item.href = link.url;
                    item.target = '_blank';
                    item.rel = 'noopener noreferrer';
                    item.title = link.name;
                    item.draggable = true;
                    item.dataset.index = index;

                    item.addEventListener('dragstart', handleDragStart);
                    item.addEventListener('dragend', handleDragEnd);

                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'quick-link-icon';
                    const fallbackSpan = document.createElement('span');
                    fallbackSpan.className = 'fallback-char';
                    fallbackSpan.textContent = link.name.charAt(0).toUpperCase();
                    iconDiv.appendChild(fallbackSpan);
                    const img = document.createElement('img');
                    img.alt = link.name.charAt(0);
                    img.style.display = 'none';
                    iconDiv.appendChild(img);

                    function setFallback() {
                        iconDiv.classList.add('fallback');
                        fallbackSpan.style.display = 'block';
                        img.style.display = 'none';
                    }

                    function setImage(src) {
                        img.onload = () => {
                            iconDiv.classList.remove('fallback');
                            fallbackSpan.style.display = 'none';
                            img.style.display = 'block';
                        };
                        img.onerror = () => { setFallback(); };
                        img.src = src;
                    }

                    // 处理图标加载
                    if (link.customIconKey) {
                        loadCustomIcon(link.customIconKey).then(dataUrl => {
                            if (dataUrl) setImage(dataUrl);
                            else setFallback();
                        }).catch(() => setFallback());
                    } else {
                        // 使用 IndexedDB 缓存的 favicon
                        const domain = link.domain;
                        // 先检查内存缓存
                        if (faviconCache.has(domain)) {
                            const cached = faviconCache.get(domain);
                            if (cached) {
                                setImage(cached);
                            } else {
                                setFallback();
                            }
                        } else {
                            // 异步从 IndexedDB 或网络加载
                            const loadFavicon = async () => {
                                const dataUrl = await fetchFaviconWithCache(domain);
                                if (dataUrl) {
                                    setImage(dataUrl);
                                } else {
                                    setFallback();
                                }
                            };
                            // 使用 requestIdleCallback 或 setTimeout 避免阻塞渲染
                            if ('requestIdleCallback' in window) {
                                requestIdleCallback(() => loadFavicon(), { timeout: 2000 });
                            } else {
                                setTimeout(loadFavicon, 50);
                            }
                            // 先显示占位符
                            setFallback();
                        }
                    }

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'quick-link-name';
                    nameSpan.textContent = link.name;
                    item.appendChild(iconDiv);
                    item.appendChild(nameSpan);
                    quickLinks.appendChild(item);
                });
                renderIconList();
            }

            // ==================== 拖拽逻辑 ====================
            function capturePositions() {
                const items = Array.from(quickLinks.children).filter(el => !el.classList.contains('drop-placeholder'));
                items.forEach(el => {
                    el._firstPos = el.getBoundingClientRect();
                });
            }

            function playFLIP() {
                const items = Array.from(quickLinks.children).filter(el => !el.classList.contains('drop-placeholder'));
                items.forEach(el => {
                    if (el._firstPos) {
                        const first = el._firstPos;
                        const last = el.getBoundingClientRect();
                        const dx = first.left - last.left;
                        const dy = first.top - last.top;
                        if (dx !== 0 || dy !== 0) {
                            el.style.transform = `translate(${dx}px, ${dy}px)`;
                            el.style.transition = 'transform 0s';
                            requestAnimationFrame(() => {
                                el.style.transition = 'transform 0.6s cubic-bezier(0.2, 0, 0, 1)';
                                el.style.transform = '';
                            });
                        }
                        delete el._firstPos;
                    }
                });
            }

            function handleDragStart(e) {
                draggedIndex = parseInt(e.currentTarget.dataset.index);
                draggedElementWidth = e.currentTarget.offsetWidth;
                draggedElementHeight = e.currentTarget.offsetHeight;
                e.dataTransfer.effectAllowed = 'move';
                e.currentTarget.classList.add('dragging');
                isDraggingQuickLink = true;
                deleteZone.classList.add('show');
                capturePositions();
                try { e.dataTransfer.setData('text/plain', String(draggedIndex)); } catch (err) {}
            }

            function handleDragOverOnContainer(e) {
                e.preventDefault();
                if (!isDraggingQuickLink) return;
                const items = Array.from(quickLinks.children).filter(el => !el.classList.contains('drop-placeholder'));
                let insertIndex = items.length;
                const mouseX = e.clientX;
                for (let i = 0; i < items.length; i++) {
                    const rect = items[i].getBoundingClientRect();
                    const midX = rect.left + rect.width / 2;
                    if (mouseX < midX) {
                        insertIndex = i;
                        break;
                    }
                }
                dropInsertIndex = insertIndex;
                if (!dropPlaceholder) {
                    dropPlaceholder = document.createElement('div');
                    dropPlaceholder.className = 'drop-placeholder';
                    dropPlaceholder.style.width = draggedElementWidth + 'px';
                    dropPlaceholder.style.height = draggedElementHeight + 'px';
                }
                const refItem = items[insertIndex] || null;
                if (refItem) {
                    quickLinks.insertBefore(dropPlaceholder, refItem);
                } else {
                    quickLinks.appendChild(dropPlaceholder);
                }
            }

            function handleDropOnContainer(e) {
                e.preventDefault();
                if (!isDraggingQuickLink || draggedIndex === null) return;
                const links = getQuickLinks();
                const originalIndex = draggedIndex;
                let targetIndex = dropInsertIndex !== null ? dropInsertIndex : originalIndex;
                if (targetIndex === originalIndex) {
                    cleanupDrag();
                    return;
                }
                if (dropPlaceholder && dropPlaceholder.parentNode) dropPlaceholder.parentNode.removeChild(dropPlaceholder);
                dropPlaceholder = null;
                const draggedEl = quickLinks.querySelector('.quick-link-item.dragging');
                if (!draggedEl) {
                    cleanupDrag();
                    return;
                }
                draggedEl.classList.remove('dragging');
                draggedEl.remove();
                if (targetIndex > originalIndex) targetIndex--;
                const children = quickLinks.children;
                if (targetIndex >= children.length) {
                    quickLinks.appendChild(draggedEl);
                } else {
                    quickLinks.insertBefore(draggedEl, children[targetIndex]);
                }
                const [removed] = links.splice(originalIndex, 1);
                links.splice(dropInsertIndex, 0, removed);
                saveQuickLinks(links);
                Array.from(quickLinks.children).forEach((el, idx) => {
                    el.dataset.index = idx;
                });
                playFLIP();
                cleanupDrag();
            }

            function handleDragEnd(e) {
                cleanupDrag();
            }

            function cleanupDrag() {
                if (dropPlaceholder && dropPlaceholder.parentNode) dropPlaceholder.parentNode.removeChild(dropPlaceholder);
                dropPlaceholder = null;
                document.querySelectorAll('.quick-link-item.dragging').forEach(el => el.classList.remove('dragging'));
                deleteZone.classList.remove('show', 'drag-over');
                isDraggingQuickLink = false;
                draggedIndex = null;
                dropInsertIndex = null;
                document.querySelectorAll('.quick-link-item').forEach(el => delete el._firstPos);
            }

            deleteZone.addEventListener('drop', (e) => {

            });

            // 新增搜索框切换事件
            searchToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const current = getSearchVisible();
                setSearchVisible(!current);
                // 如果隐藏搜索框，失去焦点（避免输入框残留）
                if (!current) {
                    searchInput.blur();
                }
            });

            aboutBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                aboutModalOverlay.classList.add('show');
                settingsPanel.classList.remove('show');
            });

            aboutModalCloseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                aboutModalOverlay.classList.remove('show');
            });

            function toggleSubmenu(submenuId) {
                const submenu = document.getElementById(submenuId);
                const isOpen = submenu.classList.contains('open');
                bgSubmenu.classList.remove('open');
                iconSubmenu.classList.remove('open');
                if (!isOpen) {
                    submenu.classList.add('open');
                    if (submenuId === 'iconSubmenu') {
                        renderIconList();
                    }
                }
            }
            bgSubmenuToggle.addEventListener('click', (e) => { e.stopPropagation();
                toggleSubmenu('bgSubmenu');
                e.currentTarget.blur(); });
            iconSubmenuToggle.addEventListener('click', (e) => { e.stopPropagation();
                toggleSubmenu('iconSubmenu');
                e.currentTarget.blur(); });

            bgUploadBtn.addEventListener('click', (e) => { e.stopPropagation();
                bgUpload.click();
                settingsPanel.classList.remove('show'); });
            randomBgBtn.addEventListener('click', (e) => { e.stopPropagation();
                randomGradient();
                settingsPanel.classList.remove('show'); });
            resetBgBtn.addEventListener('click', (e) => { e.stopPropagation();
                resetBg();
                settingsPanel.classList.remove('show'); });

            customIconUploadBtn.addEventListener('click', (e) => { e.stopPropagation();
                customIconUpload.click(); });
            addIconBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const name = iconNameInput.value.trim();
                const urlInput = iconUrlInput.value.trim();
                if (!name || !urlInput) { showToast(t('toast_name_url_required')); return; }
                let url = urlInput;
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                let domain;
                try { domain = new URL(url).hostname; } catch { domain = url.replace(/^https?:\/\//, '').split('/')[0]; }
                const links = getQuickLinks();
                const newLink = { name, url, domain };
                if (pendingCustomIcon) {
                    const iconKey = await saveCustomIcon(pendingCustomIcon);
                    if (iconKey) {
                        newLink.customIconKey = iconKey;
                    } else {
                        showToast(t('toast_icon_add_failed'));
                        pendingCustomIcon = null;
                        return;
                    }
                }
                links.push(newLink);
                const saved = saveQuickLinks(links);
                pendingCustomIcon = null;
                if (saved) {
                    renderQuickLinks();
                    iconNameInput.value = '';
                    iconUrlInput.value = '';
                    showToast(t('toast_icon_added'));
                } else {
                    showToast(t('toast_icon_add_failed'));
                }
            });

            bgUpload.addEventListener('change', (e) => { const file = e.target.files[0]; if (file) handleBgUpload(file);
                e.target.value = ''; });
            customIconUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast(t('toast_invalid_file')); return; }
                if (file.size > MAX_ICON_SIZE) { showToast(t('icon_size_exceeded')); return; }
                const reader = new FileReader();
                reader.onload = (ev) => { pendingCustomIcon = ev.target.result;
                    showToast(t('toast_icon_custom_selected')); };
                reader.readAsDataURL(file);
                e.target.value = '';
            });

            document.addEventListener('keydown', (e) => {
                const activeEl = document.activeElement;
                const isInteractive = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' ||
                    activeEl.tagName === 'BUTTON' || activeEl.tagName === 'A' || activeEl.isContentEditable);
                if (e.key === 'Enter' && !isInteractive && activeEl !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape' && aboutModalOverlay.classList.contains('show')) {
                    aboutModalOverlay.classList.remove('show');
                }
                // 移除了原有的全局 Tab 切换逻辑，因为已经在 searchInput 中单独处理
            });

            if (mainCenter) {
                mainCenter.addEventListener('animationend', () => {
                    mainCenter.classList.add('animation-done');
                });
            }

            function setupMobileScrollLock() {
                if (window.innerWidth <= 768) {
                    document.addEventListener('touchmove', preventTouchMove, { passive: false });
                } else {
                    document.removeEventListener('touchmove', preventTouchMove);
                }
            }

            function preventTouchMove(e) {
                const target = e.target;
                const scrollable = target.closest('.engine-menu, .settings-panel, .language-menu, .settings-submenu, #iconListContainer');
                if (scrollable) return;
                e.preventDefault();
            }

            async function init() {
                const savedTheme = getCurrentTheme();
                body.classList.add(`theme-${savedTheme}`);
                updateThemeToggleText();
                applyLanguage(baseLanguage);
                updateClockToggleText();
                updateSearchToggleText();  // 新增
                updateEngineDisplay();
                setClockVisible(getClockVisible());
                setSearchVisible(getSearchVisible());  // 新增
                renderQuickLinks();
                await migrateOldBgImage();
                await applyBackground();
                setupMobileScrollLock();
                window.addEventListener('resize', setupMobileScrollLock);
                if (window.innerWidth > 768 && getSearchVisible()) {
                    setTimeout(() => searchInput.focus(), 600);
                }
                const hour = new Date().getHours();
                let greetKey;
                if (hour < 6) greetKey = 'toast_greeting_night';
                else if (hour < 9) greetKey = 'toast_greeting_morning';
                else if (hour < 12) greetKey = 'toast_greeting_forenoon';
                else if (hour < 14) greetKey = 'toast_greeting_noon';
                else if (hour < 18) greetKey = 'toast_greeting_afternoon';
                else if (hour < 22) greetKey = 'toast_greeting_evening';
                else greetKey = 'toast_greeting_night';
                setTimeout(() => showToast(t(greetKey), 1500), 800);
            }

            updateClock();
            setInterval(updateClock, 1000);

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }
        })();
    </script>
</body>
</html>
