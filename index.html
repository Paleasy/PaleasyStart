            function detectSystemLanguage() {
                const lang = navigator.language || navigator.userLanguage || 'en';
                if (lang.toLowerCase().startsWith('zh')) {
                    if (lang.toLowerCase().includes('tw') || lang.toLowerCase().includes('hk') || lang.toLowerCase().includes('mo')) {
                        return 'zh-TW';
                    }
                    return 'zh';
                }
                return 'en';
            }

            function getInitialBaseLanguage() {
                const stored = localStorage.getItem(STORAGE_KEYS.language);
                if (stored === 'zh' || stored === 'en') {
                    return stored;
                }
                const sys = detectSystemLanguage();
                return (sys === 'zh' || sys === 'zh-TW') ? 'zh' : 'en';
            }

            let baseLanguage = getInitialBaseLanguage();
            let currentLanguage = baseLanguage === 'zh' ? detectSystemLanguage() : 'en';

            function t(key) {
                return translations[currentLanguage][key] || translations.zh[key] || translations.en[key] || key;
            }

            function applyLanguage(baseLang) {
                baseLanguage = baseLang;
                localStorage.setItem(STORAGE_KEYS.language, baseLang);
                if (baseLang === 'zh') {
                    currentLanguage = detectSystemLanguage() === 'zh-TW' ? 'zh-TW' : 'zh';
                } else {
                    currentLanguage = 'en';
                }

                languageBtn.textContent = baseLang === 'zh' ? '中' : 'EN';
                languageMenuItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.lang === baseLang);
                });

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.textContent = t(key);
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-i18n-placeholder');
                    el.placeholder = t(key);
                });

                updateClock();
                renderIconList();
            }

            // ==================== IndexedDB 封装 ====================
            let dbPromise;

            function openDB() {
                if (!dbPromise) {
                    dbPromise = new Promise((resolve, reject) => {
                        const request = indexedDB.open(DB_NAME, DB_VERSION);
                        request.onerror = () => reject(request.error);
                        request.onsuccess = () => resolve(request.result);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains(STORE_NAME)) {
                                db.createObjectStore(STORE_NAME);
                            }
                        };
                    });
                }
                return dbPromise;
            }

            async function saveImageToIndexedDB(key, dataUrl) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.put(dataUrl, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            async function loadImageFromIndexedDB(key) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async function deleteImageFromIndexedDB(key) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    store.delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            // ==================== Favicon IndexedDB 缓存 ====================
            function getFaviconKey(domain) {
                return 'favicon_' + domain;
            }

            async function getFaviconFromCache(domain) {
                try {
                    const dataUrl = await loadImageFromIndexedDB(getFaviconKey(domain));
                    return dataUrl;
                } catch (e) {
                    return null;
                }
            }

            async function saveFaviconToCache(domain, dataUrl) {
                try {
                    await saveImageToIndexedDB(getFaviconKey(domain), dataUrl);
                    faviconCache.set(domain, dataUrl);
                    return true;
                } catch (e) {
                    console.warn('Failed to save favicon to IndexedDB', e);
                    return false;
                }
            }

            async function migrateOldBgImage() {
                const oldData = localStorage.getItem('paleasystart_bg_image');
                if (!oldData) return;
                try {
                    const existing = await loadImageFromIndexedDB(BG_IMAGE_KEY).catch(() => null);
                    if (existing) {
                        localStorage.removeItem('paleasystart_bg_image');
                        return;
                    }
                    await saveImageToIndexedDB(BG_IMAGE_KEY, oldData);
                    localStorage.removeItem('paleasystart_bg_image');
                    localStorage.setItem(STORAGE_KEYS.bgImageMarker, 'true');
                    localStorage.setItem(STORAGE_KEYS.bgType, 'custom');
                    console.log('Migrated old background image to IndexedDB');
                } catch (e) {
                    console.warn('Migration failed', e);
                }
            }

            function getEngine() {
                const engine = localStorage.getItem(STORAGE_KEYS.engine);
                return engines[engine] ? engine : 'google';
            }

            function setEngine(engine) {
                if (!engines[engine]) engine = 'google';
                localStorage.setItem(STORAGE_KEYS.engine, engine);
                updateEngineDisplay();
            }

            function updateEngineDisplay() {
                const current = getEngine();
                const config = engines[current];

                if (engineLogoImg) {
                    engineLogoImg.style.display = 'block';
                    engineLogoFallback.style.display = 'none';
                    engineLogoImg.onerror = () => {
                        engineLogoImg.style.display = 'none';
                        engineLogoFallback.textContent = config.name.charAt(0).toUpperCase();
                        engineLogoFallback.style.display = 'block';
                    };
                    engineLogoImg.onload = () => {
                        engineLogoImg.style.display = 'block';
                        engineLogoFallback.style.display = 'none';
                    };
                    engineLogoImg.src = config.icon;
                    engineLogoImg.alt = config.name;
                }

                engineMenuItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.engine === current);
                    const miniImg = item.querySelector('.mini-logo img');
                    const miniFallback = item.querySelector('.mini-logo .fallback-text');
                    if (miniImg && miniFallback) {
                        miniImg.style.display = 'block';
                        miniFallback.style.display = 'none';
                        miniImg.onerror = () => {
                            miniImg.style.display = 'none';
                            miniFallback.style.display = 'block';
                        };
                        miniImg.onload = () => {
                            miniImg.style.display = 'block';
                            miniFallback.style.display = 'none';
                        };
                        const engineKey = item.dataset.engine;
                        if (engines[engineKey]) {
                            miniImg.src = engines[engineKey].icon;
                        }
                    }
                });
            }

            function switchEngine(delta) {
                const engineKeys = Object.keys(engines);
                const current = getEngine();
                const idx = engineKeys.indexOf(current);
                const newIdx = (idx + delta + engineKeys.length) % engineKeys.length;
                const newEngine = engineKeys[newIdx];
                setEngine(newEngine);
                showToast(t('toast_switched_engine').replace('{engine}', engines[newEngine].name));
            }

            function performSearch(mode) {
                mode = mode || 'redirect';
                const query = searchInput.value.trim();
                if (!query) {
                    searchInput.focus();
                    searchInput.style.animation = 'shake 0.4s ease';
                    setTimeout(() => searchInput.style.animation = '', 400);
                    return;
                }
                const engine = getEngine();
                const cfg = engines[engine];
                const url = cfg.url + encodeURIComponent(query);
                if (mode === 'newtab') {
                    window.open(url, '_blank', 'noopener');
                } else {
                    window.location.href = url;
                }
            }

            // ==================== 时钟 ====================
            function padZero(num) { return num < 10 ? '0' + num : num; }

            function updateClock() {
                try {
                    const now = new Date();
                    timeDisplay.textContent = padZero(now.getHours()) + ':' + padZero(now.getMinutes()) + ':' + padZero(now.getSeconds());
                    const isZh = currentLanguage === 'zh' || currentLanguage === 'zh-TW';
                    const weekdays = isZh ? ['日', '一', '二', '三', '四', '五', '六'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    let dateStr;
                    if (isZh) {
                        dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weekdays[now.getDay()]}`;
                    } else {
                        dateStr = `${now.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })} ${weekdays[now.getDay()]}`;
                    }
                    dateDisplay.textContent = dateStr;
                } catch (e) {
                    console.error('updateClock error:', e);
                }
            }

            // ==================== 时间组件显示隐藏 ====================
            function getClockVisible() {
                const stored = localStorage.getItem(STORAGE_KEYS.clockVisible);
                return stored === null ? true : stored === 'true';
            }

            function setClockVisible(visible) {
                localStorage.setItem(STORAGE_KEYS.clockVisible, visible ? 'true' : 'false');
                if (visible) {
                    clockSection.classList.remove('hidden');
                } else {
                    clockSection.classList.add('hidden');

                updateClockToggleText();

            function getSearchVisible() {

                return stored === null ? true : stored === 'true';

            // ==================== 主题管理 ====================
            function getCurrentTheme() { return localStorage.getItem(STORAGE_KEYS.theme) || 'dark'; }

            function applyTheme(theme) {
                try {
                    localStorage.setItem(STORAGE_KEYS.theme, theme);
                    body.classList.remove('theme-dark', 'theme-light');
                    body.classList.add(`theme-${theme}`);
                    updateThemeToggleText();

                    const bgType = localStorage.getItem(STORAGE_KEYS.bgType) || 'default';
                    const marker = localStorage.getItem(STORAGE_KEYS.bgImageMarker);

                    if (marker === 'true') {
                        applyBackground();
                    } else if (bgType === 'default') {
                        const defaultGrad = theme === 'dark' ? DEFAULT_DARK_GRADIENT : DEFAULT_LIGHT_GRADIENT;
                        localStorage.setItem(STORAGE_KEYS.bgGradient, defaultGrad);
                        localStorage.setItem(STORAGE_KEYS.bgType, 'default');
                        applyBackground();
                    } else {
                        applyBackground();
                    }

                    showToast(theme === 'dark' ? t('toast_switched_theme_dark') : t('toast_switched_theme_light'));
                } catch (e) {
                    console.error('applyTheme error:', e);
                }
            }

            // ==================== 背景管理 ====================
            function createDynBgStyle() {
                let el = document.getElementById('dynBgStyle');
                if (!el) {
                    el = document.createElement('style');
                    el.id = 'dynBgStyle';
                    document.head.appendChild(el);
                }
                return el;
            }

            function setBeforeOpacity(opacity) {
                body.style.setProperty('--before-opacity', opacity);
            }

            function applyGradientBackground(gradient) {
                const styleEl = createDynBgStyle();
                styleEl.textContent = `body::before { background-image: ${gradient}; }`;
            }

            async function applyBackground() {
                const marker = localStorage.getItem(STORAGE_KEYS.bgImageMarker);
                let savedGradient = localStorage.getItem(STORAGE_KEYS.bgGradient);
                const theme = getCurrentTheme();
                const bgType = localStorage.getItem(STORAGE_KEYS.bgType) || 'default';

                if (marker !== 'true') {
                    body.classList.remove('has-custom-bg');
                    if (!savedGradient || savedGradient === DARK_GRADIENT || savedGradient === LIGHT_GRADIENT) {
                        if (bgType === 'default') {
                            savedGradient = theme === 'dark' ? DEFAULT_DARK_GRADIENT : DEFAULT_LIGHT_GRADIENT;
                        } else {
                            savedGradient = theme === 'dark' ? DEFAULT_DARK_GRADIENT : DEFAULT_LIGHT_GRADIENT;
                        }
                        localStorage.setItem(STORAGE_KEYS.bgGradient, savedGradient);
                    }
                    applyGradientBackground(savedGradient);
                    setBeforeOpacity(1);
                    return;
                }

                try {
                    const dataUrl = await loadImageFromIndexedDB(BG_IMAGE_KEY);
                    if (dataUrl) {
                        body.classList.add('has-custom-bg');
                        const styleEl = createDynBgStyle();
                        styleEl.textContent = `
                            body.has-custom-bg::after { background-image: url(${dataUrl}); opacity: 1; }
                            body.has-custom-bg::before { background-image: none !important; opacity: 0.3; }
                        `;
                        if (!savedGradient || savedGradient === DARK_GRADIENT || savedGradient === LIGHT_GRADIENT) {
                            savedGradient = theme === 'dark' ? DEFAULT_DARK_GRADIENT : DEFAULT_LIGHT_GRADIENT;
                            localStorage.setItem(STORAGE_KEYS.bgGradient, savedGradient);
                        }
                    } else {
                        localStorage.removeItem(STORAGE_KEYS.bgImageMarker);
                        localStorage.setItem(STORAGE_KEYS.bgType, 'default');
                        body.classList.remove('has-custom-bg');
                        const defaultGrad = theme === 'dark' ? DEFAULT_DARK_GRADIENT : DEFAULT_LIGHT_GRADIENT;
                        localStorage.setItem(STORAGE_KEYS.bgGradient, defaultGrad);
                        applyGradientBackground(defaultGrad);
                    }
                } catch (e) {
                    console.error('Failed to load custom background', e);
                    localStorage.removeItem(STORAGE_KEYS.bgImageMarker);
                    localStorage.setItem(STORAGE_KEYS.bgType, 'default');
                    body.classList.remove('has-custom-bg');
                    const defaultGrad = theme === 'dark' ? DEFAULT_DARK_GRADIENT : DEFAULT_LIGHT_GRADIENT;
                    localStorage.setItem(STORAGE_KEYS.bgGradient, defaultGrad);
                    applyGradientBackground(defaultGrad);
                }
                setBeforeOpacity(body.classList.contains('has-custom-bg') ? 0.3 : 1);
            }

            function loadAndCompressBgImage(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const img = new Image();
                        img.onload = () => {
                            try {
                                const canvas = document.createElement('canvas');
                                canvas.width = img.naturalWidth || img.width;
                                canvas.height = img.naturalHeight || img.height;

                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                                let quality = 0.92;
                                let dataUrl = '';
                                do {
                                    dataUrl = canvas.toDataURL('image/webp', quality);
                                    quality -= 0.08;
                                } while (dataUrl.length > MAX_BG_SIZE && quality > 0.1);

                                if (!dataUrl.startsWith('data:image/webp')) {
                                    reject(new Error('WebP export is not supported'));
                                    return;
                                }
                                if (dataUrl.length > MAX_BG_SIZE) {
                                    reject(new Error('Compressed image still exceeds the maximum size'));
                                    return;
                                }
                                resolve(dataUrl);
                            } catch (err) {
                                reject(err);
                            }
                        };
                        img.onerror = () => reject(new Error('Failed to load image'));
                        img.src = reader.result;
                    };
                    reader.onerror = () => reject(new Error('Failed to read image'));
                    reader.readAsDataURL(file);
                });
            }

            async function handleBgUpload(file) {
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast(t('toast_invalid_file')); return; }
                if (file.size > MAX_BG_SIZE) { showToast(t('toast_file_too_large')); return; }
                try {
                    const dataUrl = await loadAndCompressBgImage(file);
                    await saveImageToIndexedDB(BG_IMAGE_KEY, dataUrl);
                    localStorage.setItem(STORAGE_KEYS.bgImageMarker, 'true');
                    localStorage.setItem(STORAGE_KEYS.bgType, 'custom');
                    localStorage.removeItem(STORAGE_KEYS.bgGradient);
                    await applyBackground();
                    showToast(t('toast_bg_uploaded'));
                } catch (err) {
                    console.error('Failed to compress and save image to IndexedDB', err);
                    showToast(t('toast_bg_upload_failed'));

            }

            // ==================== 快捷链接 ====================
            function getQuickLinks() { try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.quickLinks)) || []; } catch { return []; } }

            function saveQuickLinks(links) { try { localStorage.setItem(STORAGE_KEYS.quickLinks, JSON.stringify(links)); return true; } catch { return false; } }

            function loadFaviconWithTimeout(url, timeoutMs) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    let settled = false;
                    const timeoutId = setTimeout(() => {
                        if (!settled) { settled = true; reject(new Error('timeout')); }
                    }, timeoutMs);
                    img.onload = () => {
                        if (!settled) { settled = true; clearTimeout(timeoutId); resolve(url); }
                    };
                    img.onerror = () => {
                        if (!settled) { settled = true; clearTimeout(timeoutId); reject(new Error('error')); }
                    };
                    img.src = url;
                });
            }

            async function fetchFaviconWithCache(domain) {
                if (faviconCache.has(domain)) {
                    const cached = faviconCache.get(domain);
                    if (cached) return cached;
                }

                const cachedData = await getFaviconFromCache(domain);
                if (cachedData) {
                    faviconCache.set(domain, cachedData);
                    return cachedData;
                }

                const candidates = [
                    `https://${domain}/favicon.ico`,
                    `https://${domain}/favicon.png`,
                    `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`
                ];

                for (const url of candidates) {
                    try {
                        await loadFaviconWithTimeout(url, FAVICON_TIMEOUT);
                        try {
                            const img = new Image();
                            img.crossOrigin = 'anonymous';
                            await new Promise((resolve, reject) => {
                                img.onload = resolve;
                                img.onerror = reject;
                                img.src = url;
                            });
                            const canvas = document.createElement('canvas');
                            canvas.width = img.naturalWidth || 64;
                            canvas.height = img.naturalHeight || 64;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const dataUrl = canvas.toDataURL('image/png');
                            await saveFaviconToCache(domain, dataUrl);
                            faviconCache.set(domain, dataUrl);
                            return dataUrl;
                        } catch (convErr) {
                            faviconCache.set(domain, url);
                            return url;
                        }
                    } catch (e) {
                        continue;
                    }
                }
                return null;
            }

            // ★ 位置捕获与动画
            function capturePositions() {
                const items = Array.from(quickLinks.children).filter(el => !el.classList.contains('drop-placeholder'));
                items.forEach(el => {
                    el._firstPos = el.getBoundingClientRect();
                });
            }

            function playFLIP() {
                const items = Array.from(quickLinks.children).filter(el => !el.classList.contains('drop-placeholder'));
                items.forEach(el => {
                    if (el._firstPos) {
                        const first = el._firstPos;
                        const last = el.getBoundingClientRect();
                        const dx = first.left - last.left;
                        const dy = first.top - last.top;
                        if (dx !== 0 || dy !== 0) {
                            el.style.transform = `translate(${dx}px, ${dy}px)`;
                            el.style.transition = 'transform 0s';
                            requestAnimationFrame(() => {
                                el.style.transition = 'transform 0.6s cubic-bezier(0.2, 0, 0, 1)';
                                el.style.transform = '';
                            });
                        }
                        delete el._firstPos;
                    }
                });
            }

            // ★ 拖拽事件处理（占位符方案）
            function handleDragStart(e) {
                const el = e.currentTarget;
                draggedElement = el;
                draggedIndex = parseInt(el.dataset.index);
                dragCompleted = false;
                draggedPlaceholderHTML = el.innerHTML;
                draggedElementWidth = el.offsetWidth;
                draggedElementHeight = el.offsetHeight;

                const clone = el.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.left = '-9999px';
                clone.style.top = '-9999px';
                clone.style.width = draggedElementWidth + 'px';
                clone.style.height = draggedElementHeight + 'px';
                clone.style.pointerEvents = 'none';
                document.body.appendChild(clone);
                draggedClone = clone;

                const offsetX = e.offsetX || 0;
                const offsetY = e.offsetY || 0;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setDragImage(clone, offsetX, offsetY);
                isDraggingQuickLink = true;
                deleteZone.classList.add('show');
                try { e.dataTransfer.setData('text/plain', String(draggedIndex)); } catch (err) {}

                requestAnimationFrame(() => {
                    if (draggedElement && draggedElement.parentNode) {
                        if (!dropPlaceholder) {
                            dropPlaceholder = document.createElement('div');
                            dropPlaceholder.className = 'drop-placeholder';
                            dropPlaceholder.style.width = draggedElementWidth + 'px';
                            dropPlaceholder.style.height = draggedElementHeight + 'px';
                            dropPlaceholder.style.display = 'flex';
                            dropPlaceholder.style.flexDirection = 'column';
                            dropPlaceholder.style.alignItems = 'center';
                            dropPlaceholder.style.justifyContent = 'center';
                            dropPlaceholder.style.gap = '0.3rem';
                            dropPlaceholder.style.pointerEvents = 'none';
                        }
                        dropPlaceholder.innerHTML = draggedPlaceholderHTML;
                        draggedElement.parentNode.insertBefore(dropPlaceholder, draggedElement);
                        draggedElement.style.display = 'none';
                    }
                });
            }

            function handleDragOverOnContainer(e) {
                e.preventDefault();
                if (!isDraggingQuickLink || !dropPlaceholder) return;

                const items = Array.from(quickLinks.children).filter(el => el !== dropPlaceholder && el !== draggedElement);
                let insertIndex = items.length;
                const mouseX = e.clientX;
                for (let i = 0; i < items.length; i++) {
                    const rect = items[i].getBoundingClientRect();
                    const midX = rect.left + rect.width / 2;
                    if (mouseX < midX) {
                        insertIndex = i;
                        break;
                    }
                }
                dropInsertIndex = insertIndex;

                const refItem = items[insertIndex] || null;
                if (refItem) {
                    quickLinks.insertBefore(dropPlaceholder, refItem);
                } else {
                    quickLinks.appendChild(dropPlaceholder);
                }
            }

            function handleDropOnContainer(e) {
                e.preventDefault();
                if (!isDraggingQuickLink || draggedElement === null) {
                    cleanupDrag();
                    return;
                }
                dragCompleted = true;

                // 获取鼠标位置
                const mouseX = e.clientX;
                const mouseY = e.clientY;

                // 移除占位符
                if (dropPlaceholder && dropPlaceholder.parentNode) {
                    dropPlaceholder.parentNode.removeChild(dropPlaceholder);
                }

                // 更新数据
                const links = getQuickLinks();
                const originalIndex = draggedIndex;
                let targetIndex = dropInsertIndex !== null ? dropInsertIndex : originalIndex;
                if (targetIndex > originalIndex) targetIndex--;

                const [removed] = links.splice(originalIndex, 1);
                links.splice(targetIndex, 0, removed);
                saveQuickLinks(links);

                // 保存元素引用
                const element = draggedElement;

                // 恢复元素显示并插入到目标位置
                element.style.display = '';
                const children = quickLinks.children;
                const targetChild = children[targetIndex] || null;
                if (targetChild) {
                    quickLinks.insertBefore(element, targetChild);
                } else {
                    quickLinks.appendChild(element);
                }

                // 更新索引
                Array.from(quickLinks.children).forEach((el, idx) => {
                    el.dataset.index = idx;
                });

                // 自定义飞入动画：从鼠标位置飞到目标位置
                const rect = element.getBoundingClientRect();
                const dx = mouseX - rect.left;
                const dy = mouseY - rect.top;

                // 设置初始位移
                element.style.transition = 'none';
                element.style.transform = `translate(${dx}px, ${dy}px)`;
                // 强制回流
                void element.offsetHeight;
                // 过渡到原位
                element.style.transition = 'transform 0.6s cubic-bezier(0.2, 0, 0, 1)';
                element.style.transform = 'translate(0, 0)';

                // 动画结束后清除样式
                const onFinish = () => {
                    element.style.transition = '';
                    element.style.transform = '';
                    element.removeEventListener('transitionend', onFinish);
                };
                element.addEventListener('transitionend', onFinish);

                cleanupDrag();
            }

            function handleDragEnd(e) {
                if (!dragCompleted && draggedElement !== null) {
                    if (dropPlaceholder && dropPlaceholder.parentNode) {
                        dropPlaceholder.parentNode.removeChild(dropPlaceholder);
                    }
                    if (draggedElement.parentNode) {
                        draggedElement.style.display = '';
                    } else {
                        quickLinks.appendChild(draggedElement);
                        draggedElement.style.display = '';
                    }
                }
                cleanupDrag();
            }

            function cleanupDrag() {
                if (draggedClone && draggedClone.parentNode) {
                    draggedClone.parentNode.removeChild(draggedClone);
                    draggedClone = null;
                }
                if (dropPlaceholder && dropPlaceholder.parentNode) {
                    dropPlaceholder.parentNode.removeChild(dropPlaceholder);
                }
                dropPlaceholder = null;
                deleteZone.classList.remove('show', 'drag-over');
                isDraggingQuickLink = false;
                draggedIndex = null;
                dropInsertIndex = null;
                draggedElement = null;
                dragCompleted = false;
                draggedPlaceholderHTML = '';
                document.querySelectorAll('.quick-link-item').forEach(el => delete el._firstPos);
            }

            // 删除区事件
            deleteZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                deleteZone.classList.add('drag-over');
            });
            deleteZone.addEventListener('dragleave', () => {
                deleteZone.classList.remove('drag-over');
            });
            deleteZone.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedIndex !== null && draggedElement !== null) {
                    const links = getQuickLinks();
                    const removed = links.splice(draggedIndex, 1);
                    if (saveQuickLinks(links)) {
                        if (removed[0] && removed[0].customIconKey) {
                            deleteCustomIcon(removed[0].customIconKey);
                        }
                        if (draggedElement.parentNode) {
                            draggedElement.parentNode.removeChild(draggedElement);
                        }
                        if (dropPlaceholder && dropPlaceholder.parentNode) {
                            dropPlaceholder.parentNode.removeChild(dropPlaceholder);
                        }
                        renderQuickLinks();
                        showToast(t('toast_icon_deleted'));
                    }
                }
                cleanupDrag();
            });

            quickLinks.addEventListener('dragover', handleDragOverOnContainer);
            quickLinks.addEventListener('drop', handleDropOnContainer);
            quickLinks.addEventListener('dragenter', (e) => e.preventDefault());
            quickLinks.addEventListener('dragleave', (e) => {
                if (!quickLinks.contains(e.relatedTarget)) {
                    if (dropPlaceholder && dropPlaceholder.parentNode) {
                        quickLinks.appendChild(dropPlaceholder);
                    }
                }
            });

            // ==================== 渲染快捷图标 ====================
            function renderQuickLinks() {
                const links = getQuickLinks();
                quickLinks.innerHTML = '';
                links.forEach((link, index) => {
                    const item = document.createElement('a');
                    item.className = 'quick-link-item';
                    item.href = link.url;
                    // ★ 改为当前窗口打开（重定向）
                    item.target = '_self';
                    item.rel = 'noopener noreferrer';
                    item.title = link.name;
                    item.draggable = true;
                    item.dataset.index = index;

                    item.addEventListener('dragstart', handleDragStart);
                    item.addEventListener('dragend', handleDragEnd);

                    const iconDiv = document.createElement('div');
                    iconDiv.className = 'quick-link-icon';
                    const fallbackSpan = document.createElement('span');
                    fallbackSpan.className = 'fallback-char';
                    fallbackSpan.textContent = link.name.charAt(0).toUpperCase();
                    iconDiv.appendChild(fallbackSpan);
                    const img = document.createElement('img');
                    img.alt = link.name.charAt(0);
                    img.style.display = 'none';
                    iconDiv.appendChild(img);

                    function setFallback() {
                        iconDiv.classList.add('fallback');
                        fallbackSpan.style.display = 'block';
                        img.style.display = 'none';
                    }

                    function setImage(src) {
                        img.onload = () => {
                            iconDiv.classList.remove('fallback');
                            fallbackSpan.style.display = 'none';
                            img.style.display = 'block';
                        };
                        img.onerror = () => { setFallback(); };
                        img.src = src;
                    }

                    if (link.customIconKey) {
                        loadCustomIcon(link.customIconKey).then(dataUrl => {
                            if (dataUrl) setImage(dataUrl);
                            else setFallback();
                        }).catch(() => setFallback());
                    } else {
                        const domain = link.domain;
                        if (faviconCache.has(domain)) {
                            const cached = faviconCache.get(domain);
                            if (cached) {
                                setImage(cached);
                            } else {
                                setFallback();
                            }
                        } else {
                            const loadFavicon = async () => {
                                const dataUrl = await fetchFaviconWithCache(domain);
                                if (dataUrl) {
                                    setImage(dataUrl);
                                } else {
                                    setFallback();
                                }
                            };
                            if ('requestIdleCallback' in window) {
                                requestIdleCallback(() => loadFavicon(), { timeout: 2000 });
                            } else {
                                setTimeout(loadFavicon, 50);
                            }
                            setFallback();
                        }
                    }

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'quick-link-name';
                    nameSpan.textContent = link.name;
                    item.appendChild(iconDiv);
                    item.appendChild(nameSpan);
                    quickLinks.appendChild(item);
                });
                renderIconList();
            }

            // ==================== 设置面板图标列表渲染 ====================
            function renderIconList() {
                if (!iconListContainer) return;
                const links = getQuickLinks();
                iconListContainer.innerHTML = '';

                if (links.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'settings-submenu-item';
                    emptyMsg.textContent = t('no_icons');
                    emptyMsg.style.cursor = 'default';
                    emptyMsg.style.opacity = '0.5';
                    iconListContainer.appendChild(emptyMsg);
                    return;
                }

                links.forEach((link, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'settings-submenu-item';
                    itemDiv.style.cursor = 'default';
                    itemDiv.style.display = 'flex';
                    itemDiv.style.alignItems = 'center';
                    itemDiv.style.gap = '0.2rem';

                    const nameSpan = document.createElement('span');
                    nameSpan.style.cssText = 'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                    nameSpan.textContent = link.name;
                    itemDiv.appendChild(nameSpan);

                    const upBtn = document.createElement('button');
                    upBtn.className = 'sort-btn';
                    upBtn.innerHTML = '↑';
                    upBtn.title = t('move_up');
                    upBtn.disabled = index === 0;
                    upBtn.dataset.index = index;
                    upBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index);
                        if (idx === 0) return;
                        const children = quickLinks.children;
                        if (children.length < 2) return;
                        const elA = children[idx - 1];
                        const elB = children[idx];
                        const linksData = getQuickLinks();
                        [linksData[idx - 1], linksData[idx]] = [linksData[idx], linksData[idx - 1]];
                        saveQuickLinks(linksData);
                        capturePositions();
                        quickLinks.insertBefore(elB, elA);
                        Array.from(quickLinks.children).forEach((el, i) => {
                            el.dataset.index = i;
                        });
                        playFLIP();
                        renderIconList();
                    });

                    const downBtn = document.createElement('button');
                    downBtn.className = 'sort-btn';
                    downBtn.innerHTML = '↓';
                    downBtn.title = t('move_down');
                    downBtn.disabled = index === links.length - 1;
                    downBtn.dataset.index = index;
                    downBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index);
                        const linksData = getQuickLinks();
                        if (idx >= linksData.length - 1) return;
                        const children = quickLinks.children;
                        if (children.length < 2) return;
                        const elA = children[idx];
                        const elB = children[idx + 1];
                        [linksData[idx], linksData[idx + 1]] = [linksData[idx + 1], linksData[idx]];
                        saveQuickLinks(linksData);
                        capturePositions();
                        quickLinks.insertBefore(elB, elA);
                        Array.from(quickLinks.children).forEach((el, i) => {
                            el.dataset.index = i;
                        });
                        playFLIP();
                        renderIconList();
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerHTML = '✕';
                    deleteBtn.title = t('delete');
                    deleteBtn.dataset.index = index;
                    deleteBtn.addEventListener('click', async function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index);
                        const currentLinks = getQuickLinks();
                        const removed = currentLinks.splice(idx, 1);
                        if (saveQuickLinks(currentLinks)) {
                            if (removed[0] && removed[0].customIconKey) {
                                await deleteCustomIcon(removed[0].customIconKey);
                            }
                            renderQuickLinks();
                            showToast(t('toast_icon_deleted'));
                        }
                    });

                    itemDiv.appendChild(upBtn);
                    itemDiv.appendChild(downBtn);
                    itemDiv.appendChild(deleteBtn);
                    iconListContainer.appendChild(itemDiv);
                });
            }

            addIconBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const name = iconNameInput.value.trim();
                const urlInput = iconUrlInput.value.trim();
                if (!name || !urlInput) {
                    showToast(t('toast_name_url_required'));
                    return;
                }

                const currentLinks = getQuickLinks();
                if (currentLinks.length >= MAX_QUICK_LINKS) {
                    showToast(t('max_icons_reached'));
                    return;
                }

                let url = urlInput;
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                let domain;
                try { domain = new URL(url).hostname; } catch { domain = url.replace(/^https?:\/\//, '').split('/')[0]; }

                const links = getQuickLinks();
                const newLink = { name, url, domain };
                if (pendingCustomIcon) {
                    const iconKey = await saveCustomIcon(pendingCustomIcon);
                    if (iconKey) {
                        newLink.customIconKey = iconKey;
                    } else {
                        showToast(t('toast_icon_add_failed'));
                        pendingCustomIcon = null;
                        return;
                    }
                }
                links.push(newLink);
                const saved = saveQuickLinks(links);
                pendingCustomIcon = null;
                if (saved) {
                    renderQuickLinks();
                    iconNameInput.value = '';
                    iconUrlInput.value = '';
                    showToast(t('toast_icon_added'));

                    showToast(t('toast_icon_add_failed'));
                }
            });

            bgUpload.addEventListener('change', (e) => { const file = e.target.files[0]; if (file) handleBgUpload(file); e.target.value = ''; });
            customIconUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast(t('toast_invalid_file')); return; }
                if (file.size > MAX_ICON_SIZE) { showToast(t('icon_size_exceeded')); return; }
                const reader = new FileReader();
                reader.onload = (ev) => { pendingCustomIcon = ev.target.result; showToast(t('toast_icon_custom_selected')); };
                reader.readAsDataURL(file);
                e.target.value = '';
            });

            document.addEventListener('keydown', (e) => {
                const activeEl = document.activeElement;
                const isInteractive = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' ||
                    activeEl.tagName === 'BUTTON' || activeEl.tagName === 'A' || activeEl.isContentEditable);
                if (e.key === 'Enter' && !isInteractive && activeEl !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape' && aboutModalOverlay.classList.contains('show')) {
                    aboutModalOverlay.classList.remove('show');
                }
            });

            if (mainCenter) {
                mainCenter.addEventListener('animationend', () => {
                    mainCenter.classList.add('animation-done');
                });
            }

            function setupMobileScrollLock() {
                if (window.innerWidth <= 768) {
                    document.addEventListener('touchmove', preventTouchMove, { passive: false });
                } else {
                    document.removeEventListener('touchmove', preventTouchMove);
                }
            }

            function preventTouchMove(e) {
                const target = e.target;
                const scrollable = target.closest('.engine-menu, .settings-panel, .language-menu, .settings-submenu, #iconListContainer');
                if (scrollable) return;
                e.preventDefault();
            }

            async function init() {
                const savedTheme = getCurrentTheme();
                body.classList.add(`theme-${savedTheme}`);
                updateThemeToggleText();
                applyLanguage(baseLanguage);
                updateClockToggleText();
                updateSearchToggleText();
                updateEngineDisplay();
                setClockVisible(getClockVisible());
                setSearchVisible(getSearchVisible());
                renderQuickLinks();
                await migrateOldBgImage();

                const marker = localStorage.getItem(STORAGE_KEYS.bgImageMarker);
                let bgType = localStorage.getItem(STORAGE_KEYS.bgType);
                let savedGradient = localStorage.getItem(STORAGE_KEYS.bgGradient);

                if (marker === 'true') {
                    bgType = 'custom';
                    localStorage.setItem(STORAGE_KEYS.bgType, 'custom');
                } else if (!bgType || bgType === 'custom') {
                    bgType = 'default';
                    localStorage.setItem(STORAGE_KEYS.bgType, 'default');
                }

                if (bgType === 'default') {
                    if (!savedGradient || savedGradient === DARK_GRADIENT || savedGradient === LIGHT_GRADIENT) {
                        savedGradient = savedTheme === 'dark' ? DEFAULT_DARK_GRADIENT : DEFAULT_LIGHT_GRADIENT;
                        localStorage.setItem(STORAGE_KEYS.bgGradient, savedGradient);
                    }
                } else if (bgType === 'random') {
                    if (!savedGradient || savedGradient === DARK_GRADIENT || savedGradient === LIGHT_GRADIENT) {
                        const idx = Math.floor(Math.random() * gradients.length);
                        savedGradient = gradients[idx];
                        localStorage.setItem(STORAGE_KEYS.bgGradient, savedGradient);
                    }
                }

                await applyBackground();
                setupMobileScrollLock();
                window.addEventListener('resize', setupMobileScrollLock);
                if (window.innerWidth > 768 && getSearchVisible()) {
                    setTimeout(() => searchInput.focus(), 600);
                }
                const hour = new Date().getHours();
                let greetKey;
                if (hour < 6) greetKey = 'toast_greeting_night';
                else if (hour < 9) greetKey = 'toast_greeting_morning';
                else if (hour < 12) greetKey = 'toast_greeting_forenoon';
                else if (hour < 14) greetKey = 'toast_greeting_noon';
                else if (hour < 18) greetKey = 'toast_greeting_afternoon';
                else if (hour < 22) greetKey = 'toast_greeting_evening';
                else greetKey = 'toast_greeting_night';
                setTimeout(() => showToast(t(greetKey), 1500), 800);
            }

            updateClock();
            setInterval(updateClock, 1000);

            if (document.readyState === 'complete') {
                init();
            } else {
                window.addEventListener('load', init);
            }
        })();
    </script>
</body>
</html>
